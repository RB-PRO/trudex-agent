		</script>	<script>
(function () {
    function setCookie(name, value, maxAgeSeconds) {
        document.cookie =
            name + '=' + encodeURIComponent(value) +
            '; path=/' +
            '; max-age=' + maxAgeSeconds +
            '; SameSite=Lax';
    }

    function safe(fn, fallback) {
        try {
            return fn();
        } catch (e) {
            return fallback;
        }
    }

    function getNavigatorWebdriverInfo() {
        return safe(function () {
            var desc = Object.getOwnPropertyDescriptor(Navigator.prototype, 'webdriver');
            var getterString = (desc && typeof desc.get === 'function') ? String(desc.get) : '';

            return {
                // Само значение navigator.webdriver
                value: navigator.webdriver,

                // Есть ли descriptor вообще
                desc_exists: !!desc,

                // Есть ли getter
                desc_has_getter: !!(desc && typeof desc.get === 'function'),

                // Похож ли getter на нативный
                desc_getter_native: getterString.indexOf('[native code]') !== -1
            };
        }, {
            value: null,
            desc_exists: false,
            desc_has_getter: false,
            desc_getter_native: false
        });
    }

    function getIframeWebdriver() {
        return safe(function () {
            var iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.setAttribute('aria-hidden', 'true');

            var root = document.documentElement || document.body;
            if (!root) {
                return null;
            }

            root.appendChild(iframe);

            var result = null;
            try {
                result = iframe.contentWindow &&
                         iframe.contentWindow.navigator
                         ? iframe.contentWindow.navigator.webdriver
                         : null;
            } catch (e) {
                result = null;
            }

            if (iframe.parentNode) {
                iframe.parentNode.removeChild(iframe);
            }

            return result;
        }, null);
    }

    function getAutomationFlags() {
        return safe(function () {
            var ua = navigator.userAgent || '';

            return {
                // Следы headless/automation в UA
                ua_headless: /HeadlessChrome|PhantomJS|SlimerJS|Electron/i.test(ua),

                // Признаки Chrome-окружения
                has_window_chrome: !!window.chrome,
                has_chrome_runtime: !!(window.chrome && window.chrome.runtime)
            };
        }, {
            ua_headless: false,
            has_window_chrome: false,
            has_chrome_runtime: false
        });
    }

    function getPluginsInfo() {
        return {
            plugins_length: safe(function () {
                return navigator.plugins ? navigator.plugins.length : null;
            }, null),

            mime_types_length: safe(function () {
                return navigator.mimeTypes ? navigator.mimeTypes.length : null;
            }, null)
        };
    }

    function getWebGLFlags() {
        return safe(function () {
            var canvas = document.createElement('canvas');
            var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

            if (!gl) {
                return {
                    supported: false,
                    debug_ext: false,
                    vendor_present: false,
                    renderer_present: false,
                    renderer_suspicious: false
                };
            }

            var debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
            var vendor = null;
            var renderer = null;

            if (debugInfo) {
                vendor = gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL);
                renderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
            }

            var suspicious = false;
            if (renderer) {
                suspicious = /swiftshader|llvmpipe|software|mesa offscreen|virtualbox|vmware/i.test(renderer);
            }

            return {
                supported: true,
                debug_ext: !!debugInfo,
                vendor_present: !!vendor,
                renderer_present: !!renderer,
                renderer_suspicious: suspicious
            };
        }, {
            supported: false,
            debug_ext: false,
            vendor_present: false,
            renderer_present: false,
            renderer_suspicious: false
        });
    }

    function getCanvasFlags() {
        return safe(function () {
            function renderOnce() {
                var canvas = document.createElement('canvas');
                canvas.width = 220;
                canvas.height = 40;

                var ctx = canvas.getContext('2d');
                if (!ctx) {
                    return null;
                }

                ctx.textBaseline = 'top';
                ctx.font = '14px Arial';
                ctx.fillStyle = '#f60';
                ctx.fillRect(125, 1, 62, 20);
                ctx.fillStyle = '#069';
                ctx.fillText('jsinfo_canvas_test', 2, 2);
                ctx.fillStyle = 'rgba(102, 204, 0, 0.7)';
                ctx.fillText('jsinfo_canvas_test', 4, 4);

                return canvas.toDataURL();
            }

            var c1 = renderOnce();
            var c2 = renderOnce();

            supported: false,
            consistent: false

        var finished = false;

        function finish(result) {
            if (finished) {
                return;
            }
            finished = true;
            done(result);

            supported: false,
            notifications: null,
            notification_permission: safe(function () {

            }, 800);
        } catch (e) {

        }

        var automationFlags = getAutomationFlags();
        var pluginsInfo = getPluginsInfo();
        var webglFlags = getWebGLFlags();

            webdriver_desc_exists: webdriverInfo.desc_exists,
            webdriver_desc_has_getter: webdriverInfo.desc_has_getter,

            webgl_supported: webglFlags.supported,
            webgl_debug_ext: webglFlags.debug_ext,
            webgl_vendor_present: webglFlags.vendor_present,

            // 6. Canvas (без хранения длинного fingerprint)
            canvas_supported: canvasFlags.supported,
            canvas_consistent: canvasFlags.consistent,

            // 7. Permissions API
            permissions_supported: permissionsInfo.supported,
            permissions_notifications: permissionsInfo.notifications,
            notification_permission: permissionsInfo.notification_permission,

            // 8. Язык браузера
            language: safe(function () {

            }, null),
            languages: safe(function () {
                return navigator.languages ? Array.prototype.slice.call(navigator.languages) : null;
            }, null),

            // 9. Тайм-зона пользователя
            timezone: safe(function () {
                return Intl.DateTimeFormat().resolvedOptions().timeZone || null;
            }, null),
            timezone_offset: safe(function () {
                return new Date().getTimezoneOffset();
            }, null),

            // 10. Время пользователя в timestamp
            client_timestamp: Date.now()
        };

        setCookie('jsinfo', JSON.stringify(data), 3600);
    }

    getPermissionsInfo(function (permissionsInfo) {
        collectAndStore(permissionsInfo);
    });
})();
